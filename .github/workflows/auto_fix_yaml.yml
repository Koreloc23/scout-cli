name: Auto Fix YAML Syntax

on:
  workflow_run:
    workflows: ["Validate YAML Schema"]
    types:
      - completed

jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Auto fix YAML format
        run: |
          python3 << 'EOF'
          import pathlib
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 4096
          docs_dir = pathlib.Path("docs")

          for yaml_file in sorted(docs_dir.glob("docker_scout*.yaml")):
              try:
                  with open(yaml_file, "r", encoding="utf-8") as f:
                      content = yaml.load(f)
                  with open(yaml_file, "w", encoding="utf-8") as f:
                      yaml.dump(content, f)
                  print(f"✅ {yaml_file.name} - Fixed")
              except Exception as e:
                  print(f"⚠️ {yaml_file.name} - No se pudo corregir: {e}")
          EOF

      - name: Auto commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: auto-corrected YAML format errors"
          file_pattern: docs/*.yaml