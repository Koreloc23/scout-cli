name: Auto Fix YAML Syntax

on:
  push:
    paths:
      - 'docs/**.yaml'

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml yamllint

      - name: Fix YAML syntax errors
        run: |
          yamllint -d relaxed docs/

      - name: Auto commit fixes
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: auto-detected YAML syntax errors"
          file_pattern: docs/*.yaml